<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Become a Tester</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#0b0b0f; color:#eaeaea; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; }
  .card { max-width:420px; text-align:center; background:#16161c; border:1px solid #2a2a2a; border-radius:12px; padding:32px 24px; }
  h1 { font-size:20px; margin:0 0 12px; }
  p { color:#a3a3a3; line-height:1.5; margin-bottom:24px; }
  a.btn { display:inline-block; background:#1877f2; color:#fff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:600; }
  a.btn:hover { background:#166fe0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Get access to this app</h1>
    <p>Click below to log in with Facebook. This just confirms who you are - it doesn't ask for any Page or posting permissions.</p>
    <a class="btn" href="/become-tester">Login with Facebook</a>
  </div>
</body>
</html>
